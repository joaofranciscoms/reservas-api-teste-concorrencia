spring:
  application:
    name: reservationapi
  datasource:
    url: jdbc:postgresql://localhost:5432/reservations-platform
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 10
      max-lifetime: 600000
      connection-timeout: 100000
      connection-test-query: "select 1"
      pool-name: "reservation-api-manager"
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate.format_sql: true